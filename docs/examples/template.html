<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT model check — five simulated results</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #f3f3f3; background: #181818; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; line-height: 1.55; }
    main { max-width: 920px; }
    .result { padding: 26px 34px 24px; background: #181818; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 15px; margin-bottom: 24px; border-bottom: 1px solid #303030; color: #acacac; font-size: 15px; }
    .state-image { display: block; width: 140px; height: 210px; border-radius: 10px; object-fit: contain; margin-bottom: 23px; }
    h2 { margin: 0 0 17px; font-size: 24px; font-weight: 600; }
    p { margin: 0; }
    strong { font-weight: 600; }
    .detail { margin-bottom: 23px; }
    .facts { margin-bottom: 23px; }
    .facts > div + div, .usage > div + div { margin-top: 4px; }
    .usage { margin-bottom: 23px; }
    .reason { margin-bottom: 20px; }
    .action { display: flex; align-items: center; gap: 8px; color: #5785d1; font-weight: 500; }
    .record-icon { font-family: ui-monospace, monospace; font-size: 19px; }
    .retry { margin-top: 14px; }
    .retry > span { font-size: 28px; line-height: 1; }
    footer { margin-top: 25px; color: #a8a8a8; font-size: 14px; }
    @media (max-width: 480px) {
      body { font-size: 17px; }
      .result { padding: 20px; }
      header { font-size: 11px; gap: 8px; }
      h2 { font-size: 20px; }
      .facts { overflow-wrap: anywhere; }
      footer { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main aria-label="Five simulated detection outcomes">
<!-- RESULTS -->
  </main>
</body>
</html>
